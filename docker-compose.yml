version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pocket-ca-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/pocket-ca-docker
      - JWT_SECRET=pocket_ca_docker_secret_key_change_in_production
      - JWT_EXPIRES_IN=7d
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - FRONTEND_URL=http://localhost:5173
    volumes:
      - uploads_data:/usr/src/app/uploads
    depends_on:
      - mongo

  mongo:
    image: mongo:7-alpine
    container_name: pocket-ca-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
  uploads_data:
